[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "pipecat-ai[cartesia,daily,deepgram,local-smart-turn-v3,openai,runner,silero,webrtc]",
    "pipecatcloud",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=9.1.1",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
filterwarnings = [
    # Pipecat imports the stdlib audioop, deprecated on 3.12; on 3.13+ it uses the
    # audioop-lts backport instead (see uv.lock). Not our code, so hide just this one.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
